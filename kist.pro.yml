---
# =============================================================================
# Options
# =============================================================================

options:
  mode: development
  live:
    enabled: false
    port: 3000
    root: public
    watchPaths:
      - src/**
      - config/**
    ignoredPaths:
      - node_modules/**
  logLevel: debug

# =============================================================================
# Stages
# =============================================================================

stages:
  # Preprocessing
  # =========================================================================
  - name: Preprocessing
    description: "Before starting a new build."

    steps:
      # Dirs Clean
      # -----------------------------------------------------------------
      - name: CleanBuildDirStep
        action: DirectoryCleanAction
        options:
          dirPath: "./dist"

      # Build CSS + sourcemaps
      # -----------------------------------------------------------------
      - name: BuildCSS
        action: RunScriptAction
        options:
          scriptPath: "./bin/build_css.mjs"

      # Build JS + sourcemaps
      # -----------------------------------------------------------------
      - name: BuildJS
        action: RunScriptAction
        options:
          scriptPath: "./bin/build_js.mjs"

      # Build folder-based ESM modules (unbundled) + sourcemaps
      # -----------------------------------------------------------------
      - name: Build ESM Modules
        action: TypeScriptCompilerAction
        options:
          tsConfigPath: "./tsconfig.json"
          filePaths:
            - "src/ts/index.ts"
          compilerOptions:
            target: "ES2020"
            module: "ESNext"
            outDir: "./dist/js/esm"
            sourceMap: true
          declaration: true
          declarationMap: true
          declarationDir: "./dist/types"
          emitDeclarationOnly: false

      # Copy Files
      # -----------------------------------------------------------------
      - name: CopyLICENSE
        action: FileCopyAction
        options:
          srcFile: "./LICENSE"
          destDir: "./dist"
      - name: CopyREADME
        action: FileCopyAction
        options:
          srcFile: "./README.md"
          destDir: "./dist"

      # Copy Dirs
      # -----------------------------------------------------------------
      - name: CopySrcSCSS
        action: DirectoryCopyAction
        options:
          srcDir: "./src/scss"
          destDir: "./dist/scss"
      - name: CopySrcTS
        action: DirectoryCopyAction
        options:
          srcDir: "./src/ts"
          destDir: "./dist/ts"
      - name: CopySrcFont
        action: DirectoryCopyAction
        options:
          srcDir: "./src/font"
          destDir: "./dist/font"

      # Generate Sections JSON (auto-generate navigation from folder structure)
      # -----------------------------------------------------------------
      - name: GenerateSections
        action: RunScriptAction
        options:
          scriptPath: "./bin/generate_sections.mjs"

      # Render Templates (recursive with mirrored output structure)
      # -----------------------------------------------------------------
      - name: RenderTemplates
        action: RunScriptAction
        options:
          scriptPath: "./bin/render_templates.mjs"

      # Copy rendered HTML to dist
      # -----------------------------------------------------------------
      - name: CopySrcHTML
        action: DirectoryCopyAction
        options:
          srcDir: "./src/html"
          destDir: "./dist/html"

      # Compile TS to JS
      # -----------------------------------------------------------------

      # Package.json
      # -----------------------------------------------------------------
      - name: Package.json
        action: PackageManagerAction
        options:
          packageJsonPath: "./package.json"
          outputDir: "./dist"
          fields:
            - name
            - version
            - bin
            - dependencies
            - description
            - keywords
            - license
            - homepage
            - repository

      # Replace Version
      # -----------------------------------------------------------------
      - name: ReplaceVersion
        action: VersionWriteAction
        options:
          files:
            - path: "./CITATION.cff"
              key: "version: "
            - path: "./VERSION"
              key: "v"
