<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Layout Page Default</title>
        <link rel="stylesheet" href="/css/stylescape.css" />
        <style>
            /* Optional preview styles */
            .ss-c-layout-page-default > .ss-c-header,
            .ss-c-layout-page-default > .ss-c-main,
            .ss-c-layout-page-default > .ss-c-footer {
                padding: 1rem;
                font-weight: bold;
                text-align: center;
            }

            .ss-c-layout-page-default > .ss-c-header {
                background: var(--ss-color-accent);
                color: var(--ss-color-on-accent);
                /* The library header is fixed; keep it in flow for this preview. */
                position: static;
            }

            .ss-c-layout-page-default > .ss-c-main {
                flex: 1;
                background: var(--ss-color-surface-alt);
                color: var(--ss-color-text);
            }

            .ss-c-layout-page-default > .ss-c-footer {
                background: var(--ss-color-text);
                color: var(--ss-color-background);
            }
        </style>
    </head>

    <body class="ss-c-layout-page-default">
        <header class="ss-c-header">Header Area</header>

        <main class="ss-c-main">
            <h1>Main Content Area</h1>
            <p>
                This area can later become a grid with asides, sections, and
                articles.
            </p>
        </main>

        <footer class="ss-c-footer">Footer Area</footer>
    </body>
</html>
