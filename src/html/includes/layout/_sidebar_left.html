<aside class="sidebar--left" id="" role="navigation">
    <nav
        id="sidebar_left_navigation"
        class="ribbon--left ribbon--inverted"
        aria-label="Sidebar Left Navigation"
    >
        <!-- Add navigation links here -->
        <div class="ribbon__slot--vertical_top gap--02">
          <div class="tooltip tooltip--right" tooltip-data="Portal Home">
            <button class="ribbon__button">
              <a href="/en/portal/">
                <i class="i i_ui_home_plain"></i>
              </a>
            </button>
        </div>
    </nav>

    <nav
        id="sidebar_left_menu"
        class="sidebar__menu"
        aria-label="Sidebar Left Content Navigation"
    >

        <section
            id="sidebar_left_content"
            class="sidebar__content rail"
            role="region"
        >
            <h2 id="sidebar-left-label" class="visually-hidden">
                Left Sidebar Content
            </h2>

        </section>
    </nav>

    <div class="sidebar__control" role="group" aria-label="Sidebar Toggle">
        <button
            class="flipper--left"
            id="sidebar_left_switch"
            aria-pressed="false"
            aria-label="Toggle Left Sidebar"
        ></button>
    </div>
</aside>
