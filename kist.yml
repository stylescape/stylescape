---
# =============================================================================
# Options
# =============================================================================

options:
  mode: production
  logLevel: info

# =============================================================================
# Stages
# =============================================================================

stages:
  # Build
  # =========================================================================
  - name: Build
    description: "Production build for stylescape"

    steps:
      # Clean dist directory
      # -----------------------------------------------------------------
      - name: CleanDistDirectory
        action: DirectoryCleanAction
        options:
          dirPath: "./dist"

      # Build CSS (expanded) via kist action
      # -----------------------------------------------------------------
      - name: BuildCSSExpanded
        action: StyleProcessingAction
        options:
          inputFile: "./src/scss/index.scss"
          outputFile: "./dist/css/stylescape.css"
          styleOption: "expanded"

      # Build CSS (minified) via kist action
      # -----------------------------------------------------------------
      - name: BuildCSSMinified
        action: StyleProcessingAction
        options:
          inputFile: "./src/scss/index.scss"
          outputFile: "./dist/css/stylescape.min.css"
          styleOption: "compressed"

      # Build JS bundles + sourcemaps (ESM + IIFE) via tsup
      # -----------------------------------------------------------------
      - name: BuildJSEsm
        action: BundleAction
        options:
          entry:
            stylescape: "./src/ts/index.ts"
            index: "./src/ts/index.ts"
          outDir: "./dist/js"
          format: esm
          sourcemap: true
          minify: false
          dts: false
          clean: false

      - name: BuildJSEsmMin
        action: BundleAction
        options:
          entry:
            stylescape.min: "./src/ts/index.ts"
            index.min: "./src/ts/index.ts"
          outDir: "./dist/js"
          format: esm
          sourcemap: true
          minify: true
          dts: false
          clean: false

      - name: BuildJSIife
        action: BundleAction
        options:
          entry:
            stylescape.iife: "./src/ts/index.ts"
          outDir: "./dist/js"
          format: iife
          sourcemap: true
          minify: false
          dts: false
          clean: false

      - name: BuildJSIifeMin
        action: BundleAction
        options:
          entry:
            stylescape.iife.min: "./src/ts/index.ts"
          outDir: "./dist/js"
          format: iife
          sourcemap: true
          minify: true
          dts: false
          clean: false

      # Build folder-based ESM modules (unbundled) + sourcemaps
      # -----------------------------------------------------------------
      - name: BuildESMModules
        action: TypeScriptCompilerAction
        options:
          tsConfigPath: "./tsconfig.json"
          filePaths:
            - "src/ts/index.ts"
          outputDir: "./dist/js/esm"
          compilerOptions:
            target: "ES2020"
            module: "ESNext"
            sourceMap: true
            declaration: true
            declarationMap: true

      # Copy Files
      # -----------------------------------------------------------------
      - name: CopyLICENSE
        action: FileCopyAction
        options:
          srcFile: "./LICENSE"
          destDir: "./dist"

      - name: CopyREADME
        action: FileCopyAction
        options:
          srcFile: "./README.md"
          destDir: "./dist"

      # Copy Dirs
      # -----------------------------------------------------------------
      - name: CopySrcSCSS
        action: DirectoryCopyAction
        options:
          srcDir: "./src/scss"
          destDir: "./dist/scss"

      - name: CopySrcTS
        action: DirectoryCopyAction
        options:
          srcDir: "./src/ts"
          destDir: "./dist/ts"

      - name: CopySrcFont
        action: DirectoryCopyAction
        options:
          srcDir: "./src/font"
          destDir: "./dist/font"

      # Generate Sections JSON (auto-generate navigation from folder structure)
      # Note: Kept as RunScriptAction - custom logic for generating navigation
      # -----------------------------------------------------------------
      - name: GenerateSections
        action: RunScriptAction
        options:
          scriptPath: "./bin/generate_sections.mjs"

      # Render Templates via kist action
      # -----------------------------------------------------------------
      - name: RenderTemplates
        action: TemplateRenderAction
        options:
          inputDir: "./src/jinja"
          outputDir: "./src/html"
          pattern: "**/*.html.jinja"
          contextFile: "./src/jinja/data/sections.json"
          removeExtension: ".jinja"

      # Copy rendered HTML to dist
      # -----------------------------------------------------------------
      - name: CopySrcHTML
        action: DirectoryCopyAction
        options:
          srcDir: "./src/html"
          destDir: "./dist/html"

      # Package.json
      # -----------------------------------------------------------------
      - name: GeneratePackageJSON
        action: PackageManagerAction
        options:
          packageJsonPath: "./package.json"
          outputDir: "./dist"
          fields:
            - name
            - version
            - description
            - keywords
            - license
            - homepage
            - repository
            - author
            - contributors
            - main
            - module
            - types
            - sass
            - style
            - exports

      # Version synchronization
      # -----------------------------------------------------------------
      - name: SyncVersion
        action: VersionWriteAction
        options:
          files:
            - path: "./CITATION.cff"
              key: "version: "
            - path: "./VERSION"
              key: "v"
