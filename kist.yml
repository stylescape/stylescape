---
# =============================================================================
# Options
# =============================================================================

options:
  mode: production
  logLevel: info

# =============================================================================
# Stages
# =============================================================================

stages:
  # Build
  # =========================================================================
  - name: Build
    description: "Production build for stylescape"

    steps:
      # Clean dist directory
      # -----------------------------------------------------------------
      - name: CleanDistDirectory
        action: DirectoryCleanAction
        options:
          dirPath: "./dist"

      # Build CSS (expanded) via kist action
      # -----------------------------------------------------------------
      - name: BuildCSSExpanded
        action: StyleProcessingAction
        options:
          inputFile: "./src/scss/index.scss"
          outputFile: "./dist/css/stylescape.css"
          styleOption: "expanded"

      # Build CSS (minified) via kist action
      # -----------------------------------------------------------------
      - name: BuildCSSMinified
        action: StyleProcessingAction
        options:
          inputFile: "./src/scss/index.scss"
          outputFile: "./dist/css/stylescape.min.css"
          styleOption: "compressed"

      # Django admin skin: separate entry, not part of stylescape.css
      # -----------------------------------------------------------------
      - name: BuildCSSDjangoAdmin
        action: StyleProcessingAction
        options:
          inputFile: "./src/scss/django-admin.scss"
          outputFile: "./dist/css/django-admin.css"
          styleOption: "compressed"

      # Build JS bundles + sourcemaps (ESM + min + IIFE) via esbuild
      # -----------------------------------------------------------------
      # NOTE: we bundle with the `esbuild` devDependency (`bin/bundle_js.mjs`)
      # rather than kist's `BundleAction`, which used to fail on a plain
      # `entry:` string ("Cannot find 0: s"). Fixed in `@getkist/action-tsup`
      # 1.0.25 (now installed), so switching back is an option. `--prod` emits ESM + minified ESM + IIFE
      # (`stylescape[.min].js`, `index[.min].js`, `stylescape.iife[.min].js`),
      # matching the four BundleAction steps this replaces.
      - name: BuildJS
        action: RunScriptAction
        options:
          scriptPath: "./bin/bundle_js.mjs"
          args:
            - "--prod"

      # Build folder-based ESM modules (unbundled) + sourcemaps
      # -----------------------------------------------------------------
      # Emits the per-module ESM the package's subpath exports point at
      # (`./dist/js/esm/**`, e.g. `stylescape/buttons/*`) plus declarations to
      # `./dist/types` (via tsconfig's `declarationDir`).
      #
      # NOTE: `outDir` is set inside `compilerOptions` rather than via the
      # top-level `outputDir` option, which kist < 0.1.79 silently ignored.
      # Both work from 0.1.79 on.
      - name: BuildESMModules
        action: TypeScriptCompilerAction
        options:
          tsconfigPath: "./tsconfig.json"
          filePaths:
            - "src/ts/index.ts"
          compilerOptions:
            target: "ES2020"
            module: "ESNext"
            outDir: "./dist/js/esm"
            sourceMap: true
            declaration: true
            declarationMap: true

      # Copy Files
      # -----------------------------------------------------------------
      - name: CopyLICENSE
        action: FileCopyAction
        options:
          srcFile: "./LICENSE"
          destDir: "./dist"

      - name: CopyREADME
        action: FileCopyAction
        options:
          srcFile: "./README.md"
          destDir: "./dist"

      - name: CopyCSSIndex
        action: FileCopyAction
        options:
          srcFile: "./res/css/_index.scss"
          destDir: "./dist/css"

      # Copy Dirs
      # -----------------------------------------------------------------
      - name: CopySrcSCSS
        action: DirectoryCopyAction
        options:
          srcDir: "./src/scss"
          destDir: "./dist/src/scss"

      # Jinja2 templates for Django / sturnus (stylescape/base.html.jinja, …)
      - name: CopySrcTemplates
        action: DirectoryCopyAction
        options:
          srcDir: "./src/templates"
          destDir: "./dist/src/templates"

      - name: CopySrcTS
        action: DirectoryCopyAction
        options:
          srcDir: "./src/ts"
          destDir: "./dist/ts"

      - name: CopySrcFont
        action: DirectoryCopyAction
        options:
          srcDir: "./src/font"
          destDir: "./dist/font"

      # Generate Sections JSON (auto-generate navigation from folder structure)
      # Note: Kept as RunScriptAction - custom logic for generating navigation
      # -----------------------------------------------------------------
      - name: GenerateSections
        action: RunScriptAction
        options:
          scriptPath: "./bin/generate_sections.mjs"

      # Render Templates via kist action
      # -----------------------------------------------------------------
      - name: RenderTemplates
        action: TemplateRenderAction
        options:
          inputDir: "./src/jinja"
          outputDir: "./src/html"
          pattern: "**/*.html.jinja"
          contextFiles:
            - "./src/jinja/data/sections.json"
          removeExtension: ".jinja"

      # Copy rendered HTML to dist
      # -----------------------------------------------------------------
      - name: CopySrcHTML
        action: DirectoryCopyAction
        options:
          srcDir: "./src/html"
          destDir: "./dist/html"

      # Package.json
      # -----------------------------------------------------------------
      - name: GeneratePackageJSON
        action: PackageManagerAction
        options:
          packageJsonPath: "./package.json"
          outputDir: "./dist"
          fields:
            - name
            - version
            - description
            - keywords
            - license
            - homepage
            - repository
            - author
            - contributors
            - main
            - module
            - types
            - sass
            - style
            - exports
            - dependencies
            - peerDependencies
          customConfig:
            # What ships in the tarball. scss lives under src/scss so the
            # exports map is identical for the repo and the published package.
            files:
              - "css/**/*.{css,map}"
              - "font/**/*"
              - "html/**/*"
              - "js/**/*.{js,map,d.ts}"
              - "src/scss/**/*.scss"
              - "src/templates/**/*.jinja"
              - "ts/**/*.ts"
              - "types/**/*.d.ts"
              - "!.DS_Store"

      # Version synchronization
      # -----------------------------------------------------------------
      - name: SyncVersion
        action: VersionWriteAction
        options:
          files:
            - path: "./CITATION.cff"
              key: "version: "
            - path: "./VERSION"
              key: ""  # VERSION holds a bare version
