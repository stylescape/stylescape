
---


# =============================================================================
# Options
# =============================================================================

options:

    mode: development
    live:
        enabled: false
        port: 3000
        root: public
        watchPaths:
            - src/**
            - config/**
        ignoredPaths:
            - node_modules/**
    logLevel: debug


# =============================================================================
# Stages
# =============================================================================

stages:

    # Preprocessing
    # =========================================================================
    -
        name: Preprocessing
        description: "Before starting a new build."

        steps:

            # Process SCSS
            # -----------------------------------------------------------------
            -   name: ProcessMainStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/index.scss"
                    outputFile: "./dist/css/stylescape.min.css"
                    styleOption: "compressed"
            -
                name: ProcessAdditionalStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/index.scss"
                    outputFile: "./dist/css/stylescape.css"
                    styleOption: "expanded"


            # Render Templates
            # -----------------------------------------------------------------

            -
                name: RenderTemplates
                action: TemplateRenderAction
                options:
                    templatesDir: "./src/jinja"
                    outputDir: "./src/html"
                    renderAllFromDir: true
                context:
                    name: "kist"
                    version: "1.0.0"
                    author: "Lars van Vianen"

            # Compile TS to JS
            # -----------------------------------------------------------------


            -
                name: Compile TS to JS
                action: TypeScriptCompilerAction
                options:
                    tsConfigPath: "./tsconfig.json"
                    filePaths:
                        - "src/ts/index.ts"
                    outputDir: "./dist/js"
                    compilerOptions:
                        target: "ES2020"
                        module: "CommonJS"
            -
                name: Rename README File
                action: FileRenameAction
                options:
                    srcPath: "./dist/js/index.js.map"
                    targetPath: "./dist/js/stylescape.js.map"

            -
                name: Rename README File
                action: FileRenameAction
                options:
                    srcPath: "./dist/js/index.js"
                    targetPath: "./dist/js/stylescape.js"

            # Copy HTML
            # -----------------------------------------------------------------
            -
                name: CopySrcHTML
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/scss"
                    destDir: "./dist/scss"
            -
                name: CopySrcTS
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/html"
                    destDir: "./dist/html"

            -
                name: CopySrcTS
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/font"
                    destDir: "./dist/font"
            # Package.json
            # -----------------------------------------------------------------
            -
                name: Package.json
                action: PackageManagerAction
                options:
                    packageJsonPath: "./package.json"
                    outputDir: "./dist"
                    fields:
                        - name
                        - version
                        - bin
                        - dependencies
                        - description
                        - keywords
                        - license
                        - homepage
                    # customConfig:
                    #     private: true
                    #     scripts:
                    #     start: "node index.js"
                    #     build: "npm run build"
                    #     devDependencies:
                    #     typescript: "^5.0.0"
