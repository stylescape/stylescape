---
# =============================================================================
# Options
# =============================================================================

options:
  mode: development
  live:
    enabled: false
    port: 3000
    root: public
    watchPaths:
      - src/**
      - config/**
    ignoredPaths:
      - node_modules/**
  logLevel: debug

# =============================================================================
# Stages
# =============================================================================

stages:
  # Preprocessing
  # =========================================================================
  - name: Preprocessing
    description: "Before starting a new build."

    steps:
      # Build CSS + sourcemaps
      # -----------------------------------------------------------------
      - name: BuildCSS
        action: RunScriptAction
        options:
          scriptPath: "./bin/build_css.mjs"

      # Build JS + sourcemaps
      # -----------------------------------------------------------------
      - name: BuildJS
        action: RunScriptAction
        options:
          scriptPath: "./bin/build_js.mjs"

      # Build folder-based ESM modules (unbundled) + sourcemaps
      # -----------------------------------------------------------------
      - name: Build ESM Modules
        action: TypeScriptCompilerAction
        options:
          tsConfigPath: "./tsconfig.json"
          filePaths:
            - "src/ts/index.ts"
          compilerOptions:
            target: "ES2020"
            module: "ESNext"
            outDir: "./dist/js/esm"
            sourceMap: true
            declaration: true
            declarationMap: true
            declarationDir: "./dist/types"
            emitDeclarationOnly: false

      # Render Templates
      # -----------------------------------------------------------------
      - name: RenderTemplates
        action: TemplateRenderAction
        options:
          contextFiles:
            - ./src/jinja/data/sections.json
          templatesDir: "./src/jinja"
          outputDir: "./src/html"
          renderAllFromDir: true

      # Compile TS to JS
      # -----------------------------------------------------------------

      # Compile TS to JS
      # -----------------------------------------------------------------
      # -
      #     name: Rename JS File
      #     action: FileRenameAction
      #     options:
      #         srcPath: "./dist/js/index.js.map"
      #         targetPath: "./dist/js/stylescape.js.map"

      # -
      #     name: Rename JS File
      #     action: FileRenameAction
      #     options:
      #         srcPath: "./dist/js/index.js"
      #         targetPath: "./dist/js/stylescape.js"

      # Copy HTML
      # -----------------------------------------------------------------
      - name: CopySrcHTML
        action: DirectoryCopyAction
        options:
          srcDir: "./src/scss"
          destDir: "./dist/scss"
      - name: CopySrcTS
        action: DirectoryCopyAction
        options:
          srcDir: "./src/html"
          destDir: "./dist/html"

      - name: CopySrcTS
        action: DirectoryCopyAction
        options:
          srcDir: "./src/font"
          destDir: "./dist/font"

      # Package.json
      # -----------------------------------------------------------------
      - name: Package.json
        action: PackageManagerAction
        options:
          packageJsonPath: "./package.json"
          outputDir: "./dist"
          fields:
            - name
            - version
            - bin
            - dependencies
            - description
            - keywords
            - license
            - homepage
            - repository
          # customConfig:
          #     private: true
          #     scripts:
          #     start: "node index.js"
          #     build: "npm run build"
          #     devDependencies:
          #     typescript: "^5.0.0"
