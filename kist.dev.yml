---
# =============================================================================
# Options
# =============================================================================

options:
  mode: development
  logLevel: info

# =============================================================================
# Stages
# =============================================================================

stages:
  # Build
  # =========================================================================
  - name: Build
    description: "Development build for stylescape"

    steps:
      # Clean dist directory
      # -----------------------------------------------------------------
      - name: CleanDistDirectory
        action: DirectoryCleanAction
        options:
          dirPath: "./dist"

      # Build CSS (expanded) via kist action
      # -----------------------------------------------------------------
      - name: BuildCSSExpanded
        action: StyleProcessingAction
        options:
          inputFile: "./src/scss/index.scss"
          outputFile: "./dist/css/stylescape.css"
          styleOption: "expanded"

      # Build JS bundle + sourcemaps (ESM) via esbuild
      # -----------------------------------------------------------------
      # NOTE: we bundle with the `esbuild` devDependency (`bin/bundle_js.mjs`)
      # rather than kist's `BundleAction`, which used to fail on a plain
      # `entry:` string ("Cannot find 0: s"). Fixed in `@getkist/action-tsup`
      # 1.0.25 (now installed), so switching back is an option. This produces
      # `dist/js/stylescape.js` (the module the demo pages load) so the
      # `data-ss-*` behaviour layer runs.
      - name: BuildJS
        action: RunScriptAction
        options:
          scriptPath: "./bin/bundle_js.mjs"

      # Generate Sections JSON (auto-generate navigation from folder structure)
      # -----------------------------------------------------------------
      - name: GenerateSections
        action: RunScriptAction
        options:
          scriptPath: "./bin/generate_sections.mjs"

      # Render Templates via kist action
      # -----------------------------------------------------------------
      - name: RenderTemplates
        action: TemplateRenderAction
        options:
          inputDir: "./src/jinja"
          outputDir: "./src/html"
          pattern: "**/*.html.jinja"
          contextFiles:
            - "./src/jinja/data/sections.json"
          removeExtension: ".jinja"

      # Copy rendered HTML to dist
      # -----------------------------------------------------------------
      - name: CopySrcHTML
        action: DirectoryCopyAction
        options:
          srcDir: "./src/html"
          destDir: "./dist/html"
